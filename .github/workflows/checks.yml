name: Code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check examples
      - run: python -m ruff check examples
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/multipartition/authority
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/multipartition/authority/go.mod
          cache-dependency-path: examples/multipartition/authority/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
