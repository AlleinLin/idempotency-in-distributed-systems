name: idempotency-ch01

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial
      POSTGRES_DB: idempotency
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - chapter01_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d idempotency"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  chapter01_pg:
